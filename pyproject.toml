[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "api-compat-report"
version = "0.1.0"
description = "JSON Schema compatibility reports for API migrations"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
api-compat-report = "api_compatibility.cli:main"

[tool.setuptools.packages.find]
include = ["api_compatibility*"]

[tool.setuptools.package-data]
"api_compatibility" = ["artifacts/*.hex"]
